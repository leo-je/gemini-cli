name: 'Build and Release Binaries'

# 参照 test-build-binary.yml 的多平台矩阵，改动有三处：
#   1. 触发条件为 releases/* 分支推送
#   2. 去掉签名与集成测试步骤（本 fork 没有 Apple/Windows 证书，也不想在
#      发布流程里消耗 Gemini API 额度）
#   3. 增加汇总 job，把各平台产物打成 release 资产
#
# 版本号取自 package.json 的 version。同一分支重复推送会复用同一个 tag，
# 因此不会产生多个 release。
on:
  push:
    branches:
      - 'releases/*'
  workflow_dispatch:

permissions:
  contents: 'write'

defaults:
  run:
    shell: 'bash'

jobs:
  build:
    name: 'Build (${{ matrix.platform_name }})'
    runs-on: '${{ matrix.os }}'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: 'ubuntu-latest'
            platform_name: 'linux-x64'
            arch: 'x64'
          - os: 'windows-latest'
            platform_name: 'win32-x64'
            arch: 'x64'
          - os: 'macos-latest' # Apple Silicon
            platform_name: 'darwin-arm64'
            arch: 'arm64'
          - os: 'macos-latest' # Intel, running on ARM via Rosetta
            platform_name: 'darwin-x64'
            arch: 'x64'

    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8' # ratchet:actions/checkout@v5
        with:
          persist-credentials: false

      - name: 'Optimize Windows Performance'
        if: "matrix.os == 'windows-latest'"
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true
          Stop-Service -Name "wsearch" -Force -ErrorAction SilentlyContinue
          Set-Service -Name "wsearch" -StartupType Disabled
          Stop-Service -Name "SysMain" -Force -ErrorAction SilentlyContinue
          Set-Service -Name "SysMain" -StartupType Disabled
        shell: 'powershell'

      - name: 'Set up Node.js'
        uses: 'actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020' # ratchet:actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          architecture: '${{ matrix.arch }}'
          cache: 'npm'

      - name: 'Install dependencies'
        run: 'npm ci'

      - name: 'Build Binary'
        run: 'npm run build:binary'

      - name: 'Build Core Package'
        run: 'npm run build -w @google/gemini-cli-core'

      - name: 'Verify Output Exists'
        run: |
          if [ -f "dist/${{ matrix.platform_name }}/gemini" ]; then
            echo "Binary found at dist/${{ matrix.platform_name }}/gemini"
          elif [ -f "dist/${{ matrix.platform_name }}/gemini.exe" ]; then
            echo "Binary found at dist/${{ matrix.platform_name }}/gemini.exe"
          else
            echo "Error: Binary not found in dist/${{ matrix.platform_name }}/"
            ls -R dist/
            exit 1
          fi

      - name: 'Smoke Test Binary'
        run: |
          if [ -f "dist/${{ matrix.platform_name }}/gemini.exe" ]; then
            "./dist/${{ matrix.platform_name }}/gemini.exe" --version
          else
            "./dist/${{ matrix.platform_name }}/gemini" --version
          fi

      # Windows gets its own step because neither of the two tools used below
      # is dependable there: Git Bash on the windows runner has no `zip` on
      # PATH, and GNU tar reads a `-f` argument of the form `host:path` as a
      # remote-host request, so the archive path `D:\a\_temp\...` is misread
      # and it fails with "Cannot connect to D: resolve failed".
      # `Compress-Archive` ships with Windows, so it needs nothing installed.
      - name: 'Package Binary (Windows)'
        id: 'package-win'
        if: "matrix.os == 'windows-latest'"
        shell: 'pwsh'
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $platform = '${{ matrix.platform_name }}'
          $archive = "gemini-$platform-$version.zip"
          $dest = Join-Path $env:RUNNER_TEMP $archive

          # Writes to RUNNER_TEMP so the archive cannot land inside the
          # directory being packed.
          Compress-Archive -Path "dist/$platform/*" -DestinationPath $dest

          "asset=$archive" >> $env:GITHUB_OUTPUT
          Get-Item $dest | Format-List Name, Length

      - name: 'Package Binary'
        id: 'package'
        if: "matrix.os != 'windows-latest'"
        # Plain `tar` with no GNU-only flags. `--force-local` was needed when
        # Windows also used tar (its `D:\...` archive path was read as a
        # `host:path` remote request), but Windows now goes through
        # Compress-Archive above. What is left runs on Linux and macOS, and
        # macOS ships BSD tar, which rejects that flag outright with
        # "Option --force-local is not supported".
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PLATFORM="${{ matrix.platform_name }}"
          ARCHIVE="gemini-$PLATFORM-$VERSION.tar.gz"

          # Output to RUNNER_TEMP so the archive cannot land inside the
          # directory it is packing.
          tar -czf "$RUNNER_TEMP/$ARCHIVE" -C "dist/$PLATFORM" .

          echo "asset=$ARCHIVE" >> "$GITHUB_OUTPUT"
          ls -la "$RUNNER_TEMP/$ARCHIVE"

      # Only one of the two packaging steps above runs per matrix entry, so the
      # other step's outputs are empty. The `||` picks whichever was set.
      - name: 'Upload Artifact'
        uses: 'actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02' # ratchet:actions/upload-artifact@v4
        with:
          name: 'gemini-${{ steps.package-win.outputs.asset || steps.package.outputs.asset }}'
          path: '${{ runner.temp }}/${{ steps.package-win.outputs.asset || steps.package.outputs.asset }}'
          retention-days: 7
          if-no-files-found: 'error'

  bundle:
    name: 'Build JS Bundle (${{ matrix.platform_name }})'
    # Built per platform rather than once on linux, because the archive carries
    # the native modules (@lydell/node-pty, @github/keytar): npm only installs
    # the @lydell/node-pty-<platform>-<arch> subpackage matching the runner, and
    # those .node binaries cannot be produced for another OS. Building and
    # verifying on the same runner also settles "does a linux-built artifact run
    # on Windows" by construction. The JavaScript itself is platform-neutral.
    runs-on: '${{ matrix.os }}'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: 'ubuntu-latest'
            platform_name: 'linux-x64'
            arch: 'x64'
          - os: 'windows-latest'
            platform_name: 'win32-x64'
            arch: 'x64'
          - os: 'macos-latest' # Apple Silicon
            platform_name: 'darwin-arm64'
            arch: 'arm64'
          - os: 'macos-latest' # Intel, running on ARM via Rosetta
            platform_name: 'darwin-x64'
            arch: 'x64'

    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8' # ratchet:actions/checkout@v5
        with:
          persist-credentials: false

      - name: 'Set up Node.js'
        uses: 'actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020' # ratchet:actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          # Drives which @lydell/node-pty-<platform>-<arch> subpackage npm
          # installs, so darwin-x64 gets x64 binaries even on an arm64 runner.
          architecture: '${{ matrix.arch }}'
          cache: 'npm'

      - name: 'Install dependencies'
        run: 'npm ci'

      - name: 'Build Bundle'
        run: 'npm run bundle:single'

      # Windows gets its own step for the same reason as the binary job below:
      # Git Bash on the windows runner has no `zip` on PATH, while
      # `Compress-Archive` ships with Windows and needs nothing installed.
      - name: 'Package Bundle (Windows)'
        id: 'package-win'
        if: "matrix.os == 'windows-latest'"
        shell: 'pwsh'
        run: |
          $ErrorActionPreference = 'Stop'

          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $platform = '${{ matrix.platform_name }}'
          $archive = "gemini-cli-bundle-$platform-$version.zip"
          $dest = Join-Path $env:RUNNER_TEMP $archive

          # Stage the bundle with the node_modules it needs at runtime.
          # yoga-layout is external because its entry point uses top-level
          # await, which esbuild cannot inline without code splitting; the
          # native modules cannot be bundled into JavaScript at all. Staged
          # under RUNNER_TEMP so nothing lands inside the tree being packed.
          $stage = Join-Path $env:RUNNER_TEMP 'stage'
          Remove-Item -Recurse -Force $stage -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $stage 'node_modules') | Out-Null
          # -LiteralPath throughout: the docs copied into the bundle are
          # markdown files under names we do not control, and a '[' in one would
          # be read as a wildcard class by the -Path variants.
          Get-ChildItem -Path 'bundle-single' -Force |
            ForEach-Object { Copy-Item -LiteralPath $_.FullName -Destination $stage -Recurse -Force }
          foreach ($module in 'yoga-layout', '@lydell', '@github') {
            Copy-Item -LiteralPath "node_modules/$module" -Destination (Join-Path $stage 'node_modules') -Recurse -Force
          }

          $staged = Get-ChildItem -Path $stage -Force | Select-Object -ExpandProperty FullName
          Compress-Archive -LiteralPath $staged -DestinationPath $dest

          # Verify the archive rather than the staging directory, unpacked
          # outside the repository: inside it Node would resolve node_modules
          # from the workspace and hide a missing dependency.
          $test = Join-Path $env:RUNNER_TEMP 'test-bundle'
          Remove-Item -Recurse -Force $test -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $test | Out-Null
          Expand-Archive -Path $dest -DestinationPath $test

          $version = & node (Join-Path $test 'gemini.mjs') --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "Bundle reports version: $version"

          # `--version` never loads the native modules (the CLI requires them
          # lazily), so check them explicitly.
          & node scripts/verify-native-modules.js (Join-Path $test 'gemini.mjs')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Remove-Item -Recurse -Force $test, $stage -ErrorAction SilentlyContinue

          "asset=$archive" >> $env:GITHUB_OUTPUT
          Get-Item $dest | Format-List Name, Length

      - name: 'Package Bundle'
        id: 'package'
        if: "matrix.os != 'windows-latest'"
        run: |
          set -euo pipefail

          VERSION=$(node -p "require('./package.json').version")
          PLATFORM="${{ matrix.platform_name }}"
          ARCHIVE="gemini-cli-bundle-$PLATFORM-$VERSION.zip"

          # Stage the bundle with the node_modules it needs at runtime.
          # yoga-layout is external because its entry point uses top-level
          # await, which esbuild cannot inline without code splitting; the
          # native modules cannot be bundled into JavaScript at all. Staged
          # under RUNNER_TEMP so nothing lands inside the tree being packed.
          STAGE="$RUNNER_TEMP/stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/node_modules"
          cp -R bundle-single/. "$STAGE/"
          for module in yoga-layout @lydell @github; do
            cp -R "node_modules/$module" "$STAGE/node_modules/"
          done

          chmod +x "$STAGE/gemini.mjs"
          (cd "$STAGE" && zip -q -r "$RUNNER_TEMP/$ARCHIVE" .)

          # Verify the archive rather than the staging directory, unpacked
          # outside the repository: inside it Node would resolve node_modules
          # from the workspace and hide a missing dependency.
          rm -rf "$RUNNER_TEMP/test-bundle"
          mkdir -p "$RUNNER_TEMP/test-bundle"
          unzip -q "$RUNNER_TEMP/$ARCHIVE" -d "$RUNNER_TEMP/test-bundle"
          # Assigned before echoing: `echo "... $(node ...)"` would swallow a
          # non-zero exit from node, which `set -e` cannot see through.
          VERSION_OUT=$(node "$RUNNER_TEMP/test-bundle/gemini.mjs" --version)
          echo "Bundle reports version: ${VERSION_OUT}"

          # `--version` never loads the native modules (the CLI requires them
          # lazily), so check them explicitly.
          node scripts/verify-native-modules.js "$RUNNER_TEMP/test-bundle/gemini.mjs"

          rm -rf "$RUNNER_TEMP/test-bundle" "$STAGE"

          echo "asset=$ARCHIVE" >> "$GITHUB_OUTPUT"
          ls -la "$RUNNER_TEMP/$ARCHIVE"

      # Only one of the two packaging steps above runs per matrix entry, so the
      # other step's outputs are empty. The `||` picks whichever was set.
      - name: 'Upload Artifact'
        uses: 'actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02' # ratchet:actions/upload-artifact@v4
        with:
          name: 'gemini-${{ steps.package-win.outputs.asset || steps.package.outputs.asset }}'
          path: '${{ runner.temp }}/${{ steps.package-win.outputs.asset || steps.package.outputs.asset }}'
          retention-days: 7
          if-no-files-found: 'error'

  release:
    name: 'Publish Release'
    # Each bundle is now built and smoke tested on the platform it targets, so
    # the cross-platform verification job that used to sit here is gone.
    needs: ['build', 'bundle']
    runs-on: 'ubuntu-latest'

    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8' # ratchet:actions/checkout@v5
        with:
          persist-credentials: false

      - name: 'Download all binaries'
        uses: 'actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0' # ratchet:actions/download-artifact@v5
        with:
          path: 'downloads'
          merge-multiple: true
          pattern: 'gemini-*'

      - name: 'Create Release'
        env:
          GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
        run: |
          set -euo pipefail

          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          BRANCH="${GITHUB_REF#refs/heads/}"

          echo "Releasing ${TAG} from ${BRANCH}"
          ls -la downloads/

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; replacing its assets."
            gh release upload "$TAG" downloads/* --clobber
          else
            gh release create "$TAG" downloads/* \
              --target "$BRANCH" \
              --title "Release ${TAG}" \
              --generate-notes
          fi
