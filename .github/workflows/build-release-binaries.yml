name: 'Build and Release Binaries'

# 参照 test-build-binary.yml 的多平台矩阵，改动有三处：
#   1. 触发条件为 releases/* 分支推送
#   2. 去掉签名与集成测试步骤（本 fork 没有 Apple/Windows 证书，也不想在
#      发布流程里消耗 Gemini API 额度）
#   3. 增加汇总 job，把各平台产物打成 release 资产
#
# 版本号取自 package.json 的 version。同一分支重复推送会复用同一个 tag，
# 因此不会产生多个 release。
#
# 产物命名一律带程序名 gemini-cli-leo：
#   gemini-cli-leo-<platform>-<version>.tar.gz / .zip   原生二进制（SEA）
#   gemini-cli-leo-bundle-<platform>-<version>.tgz      JS bundle，可直接 npm i -g
# 最后一个平台的 bundle 之后会发布到 npm（包名 gemini-cli-leo），用的是仓库
# secret 里的 NPM_TOKEN。
on:
  push:
    branches:
      - 'releases/*'
  workflow_dispatch:

permissions:
  contents: 'write'

defaults:
  run:
    shell: 'bash'

jobs:
  build:
    name: 'Build (${{ matrix.platform_name }})'
    runs-on: '${{ matrix.os }}'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: 'ubuntu-latest'
            platform_name: 'linux-x64'
            arch: 'x64'
          - os: 'windows-latest'
            platform_name: 'win32-x64'
            arch: 'x64'
          - os: 'macos-latest' # Apple Silicon
            platform_name: 'darwin-arm64'
            arch: 'arm64'
          - os: 'macos-latest' # Intel, running on ARM via Rosetta
            platform_name: 'darwin-x64'
            arch: 'x64'

    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8' # ratchet:actions/checkout@v5
        with:
          persist-credentials: false

      - name: 'Optimize Windows Performance'
        if: "matrix.os == 'windows-latest'"
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true
          Stop-Service -Name "wsearch" -Force -ErrorAction SilentlyContinue
          Set-Service -Name "wsearch" -StartupType Disabled
          Stop-Service -Name "SysMain" -Force -ErrorAction SilentlyContinue
          Set-Service -Name "SysMain" -StartupType Disabled
        shell: 'powershell'

      - name: 'Set up Node.js'
        uses: 'actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020' # ratchet:actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          architecture: '${{ matrix.arch }}'
          cache: 'npm'

      - name: 'Install dependencies'
        run: 'npm ci'

      - name: 'Build Binary'
        run: 'npm run build:binary'

      - name: 'Build Core Package'
        run: 'npm run build -w @google/gemini-cli-core'

      - name: 'Verify Output Exists'
        run: |
          if [ -f "dist/${{ matrix.platform_name }}/gemini" ]; then
            echo "Binary found at dist/${{ matrix.platform_name }}/gemini"
          elif [ -f "dist/${{ matrix.platform_name }}/gemini.exe" ]; then
            echo "Binary found at dist/${{ matrix.platform_name }}/gemini.exe"
          else
            echo "Error: Binary not found in dist/${{ matrix.platform_name }}/"
            ls -R dist/
            exit 1
          fi

      - name: 'Smoke Test Binary'
        run: |
          if [ -f "dist/${{ matrix.platform_name }}/gemini.exe" ]; then
            "./dist/${{ matrix.platform_name }}/gemini.exe" --version
          else
            "./dist/${{ matrix.platform_name }}/gemini" --version
          fi

      # Windows gets its own step because neither of the two tools used below
      # is dependable there: Git Bash on the windows runner has no `zip` on
      # PATH, and GNU tar reads a `-f` argument of the form `host:path` as a
      # remote-host request, so the archive path `D:\a\_temp\...` is misread
      # and it fails with "Cannot connect to D: resolve failed".
      # `Compress-Archive` ships with Windows, so it needs nothing installed.
      - name: 'Package Binary (Windows)'
        id: 'package-win'
        if: "matrix.os == 'windows-latest'"
        shell: 'pwsh'
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $platform = '${{ matrix.platform_name }}'
          $archive = "gemini-cli-leo-$platform-$version.zip"
          $dest = Join-Path $env:RUNNER_TEMP $archive

          # Writes to RUNNER_TEMP so the archive cannot land inside the
          # directory being packed.
          Compress-Archive -Path "dist/$platform/*" -DestinationPath $dest

          "asset=$archive" >> $env:GITHUB_OUTPUT
          Get-Item $dest | Format-List Name, Length

      - name: 'Package Binary'
        id: 'package'
        if: "matrix.os != 'windows-latest'"
        # Plain `tar` with no GNU-only flags. `--force-local` was needed when
        # Windows also used tar (its `D:\...` archive path was read as a
        # `host:path` remote request), but Windows now goes through
        # Compress-Archive above. What is left runs on Linux and macOS, and
        # macOS ships BSD tar, which rejects that flag outright with
        # "Option --force-local is not supported".
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PLATFORM="${{ matrix.platform_name }}"
          ARCHIVE="gemini-cli-leo-$PLATFORM-$VERSION.tar.gz"

          # Output to RUNNER_TEMP so the archive cannot land inside the
          # directory it is packing.
          tar -czf "$RUNNER_TEMP/$ARCHIVE" -C "dist/$PLATFORM" .

          echo "asset=$ARCHIVE" >> "$GITHUB_OUTPUT"
          ls -la "$RUNNER_TEMP/$ARCHIVE"

      # Only one of the two packaging steps above runs per matrix entry, so the
      # other step's outputs are empty. The `||` picks whichever was set.
      - name: 'Upload Artifact'
        uses: 'actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02' # ratchet:actions/upload-artifact@v4
        with:
          name: '${{ steps.package-win.outputs.asset || steps.package.outputs.asset }}'
          path: '${{ runner.temp }}/${{ steps.package-win.outputs.asset || steps.package.outputs.asset }}'
          retention-days: 7
          if-no-files-found: 'error'

  bundle:
    name: 'Build JS Bundle (${{ matrix.platform_name }})'
    # Built per platform rather than once on linux, because the archive carries
    # the native modules (@lydell/node-pty, @github/keytar): npm only installs
    # the @lydell/node-pty-<platform>-<arch> subpackage matching the runner, and
    # those .node binaries cannot be produced for another OS. Building and
    # verifying on the same runner also settles "does a linux-built artifact run
    # on Windows" by construction. The JavaScript itself is platform-neutral.
    runs-on: '${{ matrix.os }}'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: 'ubuntu-latest'
            platform_name: 'linux-x64'
            arch: 'x64'
          - os: 'windows-latest'
            platform_name: 'win32-x64'
            arch: 'x64'
          - os: 'macos-latest' # Apple Silicon
            platform_name: 'darwin-arm64'
            arch: 'arm64'
          - os: 'macos-latest' # Intel, running on ARM via Rosetta
            platform_name: 'darwin-x64'
            arch: 'x64'

    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8' # ratchet:actions/checkout@v5
        with:
          persist-credentials: false

      - name: 'Set up Node.js'
        uses: 'actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020' # ratchet:actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          # Drives which @lydell/node-pty-<platform>-<arch> subpackage npm
          # installs, so darwin-x64 gets x64 binaries even on an arm64 runner.
          architecture: '${{ matrix.arch }}'
          cache: 'npm'

      - name: 'Install dependencies'
        run: 'npm ci'

      - name: 'Build Bundle'
        run: 'npm run bundle:single'

      # Windows gets its own step for the same reason as the binary job below:
      # Git Bash on the windows runner has no `zip` on PATH. Packaging no longer
      # needs a compression tool at all — `npm pack` writes the tarball.
      - name: 'Package Bundle (Windows)'
        id: 'package-win'
        if: "matrix.os == 'windows-latest'"
        shell: 'pwsh'
        run: |
          $ErrorActionPreference = 'Stop'

          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $platform = '${{ matrix.platform_name }}'
          $archive = "gemini-cli-leo-bundle-$platform-$version.tgz"
          $dest = Join-Path $env:RUNNER_TEMP $archive

          # Pack bundle-single/ as an installable tarball. `npm run bundle:single`
          # writes a package.json into it, which gives the package a name and a
          # `gemini-leo` bin. No node_modules are staged: shipping them would
          # carry this runner's native binaries. npm resolves the one declared
          # runtime dependency, yoga-layout, on the machine that installs it.
          #
          # The archive is a .tgz rather than a .zip because npm only installs
          # local directories and tarballs — it reads a .zip argument as a
          # directory and fails on the missing package.json inside it.
          #
          # Staged under RUNNER_TEMP: npm pack copies whatever it finds there
          # verbatim, so packing outside the repository also keeps .gitignore and
          # node_modules out of the tarball.
          $stage = Join-Path $env:RUNNER_TEMP 'stage'
          Remove-Item -Recurse -Force $stage -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          # -LiteralPath throughout: the docs copied into the bundle are
          # markdown files under names we do not control, and a '[' in one would
          # be read as a wildcard class by the -Path variants.
          Get-ChildItem -Path 'bundle-single' -Force |
            ForEach-Object { Copy-Item -LiteralPath $_.FullName -Destination $stage -Recurse -Force }

          Remove-Item (Join-Path $env:RUNNER_TEMP '*.tgz') -Force -ErrorAction SilentlyContinue
          npm pack $stage --pack-destination $env:RUNNER_TEMP --loglevel=warn
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # npm derives the filename from the manifest; rename it so the asset is
          # not tied to the package name.
          $packed = Get-ChildItem -Path $env:RUNNER_TEMP -Filter '*.tgz' | Select-Object -First 1
          Move-Item -Force -LiteralPath $packed.FullName -Destination $dest

          # Verify by installing the tarball into a throwaway prefix. A global
          # install, unlike `npm link` or `npm install -g <dir>`, copies the
          # package and resolves dependencies — which is what a user gets from
          # the downloaded archive.
          $prefix = Join-Path $env:RUNNER_TEMP 'npm-prefix'
          Remove-Item -Recurse -Force $prefix -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $prefix | Out-Null
          npm install -g --prefix $prefix $dest --loglevel=warn
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $installed = Join-Path $prefix 'node_modules/gemini-cli-leo'
          if (-not (Test-Path (Join-Path $installed 'gemini.mjs'))) {
            throw "Installing $archive did not place the entry under $installed"
          }
          if (-not (Test-Path (Join-Path $installed 'node_modules/yoga-layout'))) {
            throw "Installing $archive did not resolve yoga-layout"
          }
          # The bin mapping is what turns the package into a command. npm puts
          # global shims in the prefix root on Windows.
          $command = @(
            (Join-Path $prefix 'gemini-leo.cmd'),
            (Join-Path $prefix 'bin/gemini-leo.cmd')
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $command) {
            throw "Installing $archive did not create a gemini-leo command"
          }

          # Run the installed copy: from here node resolves the package's own
          # node_modules. Running the staging directory instead would resolve the
          # workspace's, hiding a packaging mistake.
          $version = & node (Join-Path $installed 'gemini.mjs') --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "Bundle reports version: $version"

          Remove-Item -Recurse -Force $prefix, $stage -ErrorAction SilentlyContinue

          "asset=$archive" >> $env:GITHUB_OUTPUT
          Get-Item $dest | Format-List Name, Length

      - name: 'Package Bundle'
        id: 'package'
        if: "matrix.os != 'windows-latest'"
        run: |
          set -euo pipefail

          VERSION=$(node -p "require('./package.json').version")
          PLATFORM="${{ matrix.platform_name }}"
          ARCHIVE="gemini-cli-leo-bundle-$PLATFORM-$VERSION.tgz"

          # Pack bundle-single/ as an installable tarball. `npm run bundle:single`
          # writes a package.json into it, which gives the package a name and a
          # `gemini-leo` bin. No node_modules are staged: shipping them would
          # carry this runner's native binaries. npm resolves the one declared
          # runtime dependency, yoga-layout, on the machine that installs it.
          #
          # The archive is a .tgz rather than a .zip because npm only installs
          # local directories and tarballs — it reads a .zip argument as a
          # directory and fails on the missing package.json inside it.
          #
          # Staged under RUNNER_TEMP: npm pack copies whatever it finds there
          # verbatim, so packing outside the repository also keeps .gitignore and
          # node_modules out of the tarball.
          STAGE="$RUNNER_TEMP/stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp -R bundle-single/. "$STAGE/"

          chmod +x "$STAGE/gemini.mjs"
          rm -f "$RUNNER_TEMP"/*.tgz
          npm pack "$STAGE" --pack-destination "$RUNNER_TEMP" --loglevel=warn
          # npm derives the filename from the manifest; rename it so the asset is
          # not tied to the package name.
          mv "$RUNNER_TEMP"/*.tgz "$RUNNER_TEMP/$ARCHIVE"

          # Verify by installing the tarball into a throwaway prefix. A global
          # install, unlike `npm link` or `npm install -g <dir>`, copies the
          # package and resolves dependencies — which is what a user gets from
          # the downloaded archive.
          PREFIX="$RUNNER_TEMP/npm-prefix"
          rm -rf "$PREFIX"
          mkdir -p "$PREFIX"
          npm install -g --prefix "$PREFIX" "$RUNNER_TEMP/$ARCHIVE" --loglevel=warn

          INSTALLED="$PREFIX/lib/node_modules/gemini-cli-leo"
          test -f "$INSTALLED/gemini.mjs"
          test -d "$INSTALLED/node_modules/yoga-layout"
          test -x "$PREFIX/bin/gemini-leo"

          # Run the installed copy: from here node resolves the package's own
          # node_modules. Running the staging directory instead would resolve the
          # workspace's, hiding a packaging mistake.
          # Assigned before echoing: `echo "... $(node ...)"` would swallow a
          # non-zero exit from node, which `set -e` cannot see through.
          VERSION_OUT=$(node "$INSTALLED/gemini.mjs" --version)
          echo "Bundle reports version: ${VERSION_OUT}"

          rm -rf "$PREFIX" "$STAGE"

          echo "asset=$ARCHIVE" >> "$GITHUB_OUTPUT"
          ls -la "$RUNNER_TEMP/$ARCHIVE"

      # Only one of the two packaging steps above runs per matrix entry, so the
      # other step's outputs are empty. The `||` picks whichever was set.
      - name: 'Upload Artifact'
        uses: 'actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02' # ratchet:actions/upload-artifact@v4
        with:
          name: '${{ steps.package-win.outputs.asset || steps.package.outputs.asset }}'
          path: '${{ runner.temp }}/${{ steps.package-win.outputs.asset || steps.package.outputs.asset }}'
          retention-days: 7
          if-no-files-found: 'error'

  release:
    name: 'Publish Release'
    # Each bundle is now built and smoke tested on the platform it targets, so
    # the cross-platform verification job that used to sit here is gone.
    needs: ['build', 'bundle']
    runs-on: 'ubuntu-latest'

    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8' # ratchet:actions/checkout@v5
        with:
          persist-credentials: false

      - name: 'Download all binaries'
        uses: 'actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0' # ratchet:actions/download-artifact@v5
        with:
          path: 'downloads'
          merge-multiple: true
          pattern: 'gemini-cli-leo-*'

      - name: 'Create Release'
        env:
          GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
        run: |
          set -euo pipefail

          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          BRANCH="${GITHUB_REF#refs/heads/}"

          echo "Releasing ${TAG} from ${BRANCH}"
          ls -la downloads/

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; replacing its assets."
            gh release upload "$TAG" downloads/* --clobber
          else
            gh release create "$TAG" downloads/* \
              --target "$BRANCH" \
              --title "Release ${TAG}" \
              --generate-notes
          fi

  publish-npm:
    name: 'Publish to npm'
    # Publishing is the one step a re-run cannot undo — npm refuses to overwrite
    # a version. It therefore runs last, after every platform has built and the
    # GitHub release exists.
    needs: ['bundle', 'release']
    runs-on: 'ubuntu-latest'

    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8' # ratchet:actions/checkout@v5
        with:
          persist-credentials: false

      - name: 'Set up Node.js'
        uses: 'actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020' # ratchet:actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          # Writes the registry into .npmrc; NODE_AUTH_TOKEN below supplies the
          # credential for it.
          registry-url: 'https://registry.npmjs.org'

      - name: 'Check the npm token'
        env:
          NODE_AUTH_TOKEN: '${{ secrets.NPM_TOKEN }}'
        run: |
          set -euo pipefail

          # A missing secret otherwise fails much later, inside npm, as an
          # unsubscribe-able E401 that says nothing about what to fix.
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::The NPM_TOKEN secret is empty or missing. Add an npm access token with publish rights under Settings -> Secrets and variables -> Actions, then re-run this job."
            exit 1
          fi
          # Proves the token authenticates before anything is uploaded.
          npm whoami

      - name: 'Download the bundle tarball'
        uses: 'actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0' # ratchet:actions/download-artifact@v5
        with:
          path: 'downloads'
          merge-multiple: true
          # The bundle's JavaScript is platform-neutral and no native binaries are
          # staged into it, so one platform's tarball is the package for all of
          # them. Taking the linux-x64 entry keeps the choice deterministic.
          pattern: 'gemini-cli-leo-bundle-linux-x64-*'

      - name: 'Publish'
        env:
          NODE_AUTH_TOKEN: '${{ secrets.NPM_TOKEN }}'
        run: |
          set -euo pipefail

          TARBALL=$(find downloads -maxdepth 1 -name '*.tgz' | head -1)
          if [ -z "$TARBALL" ]; then
            echo "No bundle tarball was downloaded." >&2
            exit 1
          fi

          # npm reads a bare path as a hosted git spec ("ssh://git@github.com/..."),
          # so the tarball has to be spelled as a local file.
          case "$TARBALL" in
            /*) ;;
            *) TARBALL="./$TARBALL" ;;
          esac

          # Read the manifest out of the tarball rather than package.json: the
          # archive is what gets published, and npm takes the name and version
          # from inside it.
          MANIFEST=$(tar -xzOf "$TARBALL" package/package.json)
          NAME=$(printf '%s' "$MANIFEST" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).name")
          VERSION=$(printf '%s' "$MANIFEST" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")

          echo "Publishing ${NAME}@${VERSION} from ${TARBALL}"

          # Re-pushing a release branch must not fail the workflow: an npm
          # version is permanent, so an existing one is simply left alone.
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "${NAME}@${VERSION} is already on the registry; nothing to do."
            exit 0
          fi

          # The fork only ships prerelease-suffixed versions (0.1.19-fix.N), and
          # npm refuses to publish one without an explicit tag. `latest` is the
          # right default here: `npm install -g gemini-cli-leo` should get the
          # newest release without the user having to know a tag name.
          npm publish "$TARBALL" --access public --tag latest
          echo "Published ${NAME}@${VERSION}"
