name: 'Build and Release Binaries'

# 参照 test-build-binary.yml 的多平台矩阵，改动有三处：
#   1. 触发条件为 releases/* 分支推送
#   2. 去掉签名与集成测试步骤（本 fork 没有 Apple/Windows 证书，也不想在
#      发布流程里消耗 Gemini API 额度）
#   3. 增加汇总 job，把各平台产物打成 release 资产
#
# 版本号取自 package.json 的 version。同一分支重复推送会复用同一个 tag，
# 因此不会产生多个 release。
on:
  push:
    branches:
      - 'releases/*'
  workflow_dispatch:

permissions:
  contents: 'write'

defaults:
  run:
    shell: 'bash'

jobs:
  build:
    name: 'Build (${{ matrix.platform_name }})'
    runs-on: '${{ matrix.os }}'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: 'ubuntu-latest'
            platform_name: 'linux-x64'
            arch: 'x64'
          - os: 'windows-latest'
            platform_name: 'win32-x64'
            arch: 'x64'
          - os: 'macos-latest' # Apple Silicon
            platform_name: 'darwin-arm64'
            arch: 'arm64'
          - os: 'macos-latest' # Intel, running on ARM via Rosetta
            platform_name: 'darwin-x64'
            arch: 'x64'

    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8' # ratchet:actions/checkout@v5
        with:
          persist-credentials: false

      - name: 'Optimize Windows Performance'
        if: "matrix.os == 'windows-latest'"
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true
          Stop-Service -Name "wsearch" -Force -ErrorAction SilentlyContinue
          Set-Service -Name "wsearch" -StartupType Disabled
          Stop-Service -Name "SysMain" -Force -ErrorAction SilentlyContinue
          Set-Service -Name "SysMain" -StartupType Disabled
        shell: 'powershell'

      - name: 'Set up Node.js'
        uses: 'actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020' # ratchet:actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          architecture: '${{ matrix.arch }}'
          cache: 'npm'

      - name: 'Install dependencies'
        run: 'npm ci'

      - name: 'Build Binary'
        run: 'npm run build:binary'

      - name: 'Build Core Package'
        run: 'npm run build -w @google/gemini-cli-core'

      - name: 'Verify Output Exists'
        run: |
          if [ -f "dist/${{ matrix.platform_name }}/gemini" ]; then
            echo "Binary found at dist/${{ matrix.platform_name }}/gemini"
          elif [ -f "dist/${{ matrix.platform_name }}/gemini.exe" ]; then
            echo "Binary found at dist/${{ matrix.platform_name }}/gemini.exe"
          else
            echo "Error: Binary not found in dist/${{ matrix.platform_name }}/"
            ls -R dist/
            exit 1
          fi

      - name: 'Smoke Test Binary'
        run: |
          if [ -f "dist/${{ matrix.platform_name }}/gemini.exe" ]; then
            "./dist/${{ matrix.platform_name }}/gemini.exe" --version
          else
            "./dist/${{ matrix.platform_name }}/gemini" --version
          fi

      - name: 'Package Binary'
        id: 'package'
        # `tar` rather than `zip`: the Windows runner's Git Bash has no zip on
        # PATH (it is not part of the base image), while tar ships everywhere
        # including Windows. Output goes to RUNNER_TEMP so the archive cannot
        # end up inside the directory it is packing.
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PLATFORM="${{ matrix.platform_name }}"
          ARCHIVE="gemini-$PLATFORM-$VERSION.tar.gz"

          tar -czf "$RUNNER_TEMP/$ARCHIVE" -C "dist/$PLATFORM" .

          echo "asset=$ARCHIVE" >> "$GITHUB_OUTPUT"
          ls -la "$RUNNER_TEMP/$ARCHIVE"

      - name: 'Upload Artifact'
        uses: 'actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02' # ratchet:actions/upload-artifact@v4
        with:
          name: 'gemini-${{ steps.package.outputs.asset }}'
          path: '${{ runner.temp }}/${{ steps.package.outputs.asset }}'
          retention-days: 7
          if-no-files-found: 'error'

  bundle:
    name: 'Build JS Bundle'
    # The bundle is pure JS with no native modules, so one linux build serves
    # every platform — it needs a Node runtime rather than a self-contained
    # binary. Built once and shipped alongside the per-platform binaries, which
    # is what the upstream release does.
    runs-on: 'ubuntu-latest'

    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8' # ratchet:actions/checkout@v5
        with:
          persist-credentials: false

      - name: 'Set up Node.js'
        uses: 'actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020' # ratchet:actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: 'Install dependencies'
        run: 'npm ci'

      - name: 'Build Bundle'
        run: 'npm run bundle'

      - name: 'Package Bundle'
        id: 'package'
        # zip is available on the ubuntu runner (it is not on windows-latest —
        # see the binary job). Named without a platform suffix so it is
        # recognisable as the cross-platform asset.
        run: |
          set -euo pipefail

          chmod +x bundle/gemini.js
          (cd bundle && zip -r "$RUNNER_TEMP/gemini-cli-bundle.zip" .)

          # Prove the archive is self-contained before publishing it.
          rm -rf test-bundle
          mkdir -p test-bundle
          unzip -q "$RUNNER_TEMP/gemini-cli-bundle.zip" -d test-bundle
          VERSION_OUT=$(node test-bundle/gemini.js --version)
          echo "Bundle reports version: ${VERSION_OUT}"
          rm -rf test-bundle

          echo "asset=gemini-cli-bundle.zip" >> "$GITHUB_OUTPUT"
          ls -la "$RUNNER_TEMP/gemini-cli-bundle.zip"

      - name: 'Upload Artifact'
        uses: 'actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02' # ratchet:actions/upload-artifact@v4
        with:
          name: 'gemini-${{ steps.package.outputs.asset }}'
          path: '${{ runner.temp }}/${{ steps.package.outputs.asset }}'
          retention-days: 7
          if-no-files-found: 'error'

  release:
    name: 'Publish Release'
    needs: ['build', 'bundle']
    runs-on: 'ubuntu-latest'

    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8' # ratchet:actions/checkout@v5
        with:
          persist-credentials: false

      - name: 'Download all binaries'
        uses: 'actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0' # ratchet:actions/download-artifact@v5
        with:
          path: 'downloads'
          merge-multiple: true
          pattern: 'gemini-*'

      - name: 'Create Release'
        env:
          GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
        run: |
          set -euo pipefail

          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          BRANCH="${GITHUB_REF#refs/heads/}"

          echo "Releasing ${TAG} from ${BRANCH}"
          ls -la downloads/

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; replacing its assets."
            gh release upload "$TAG" downloads/* --clobber
          else
            gh release create "$TAG" downloads/* \
              --target "$BRANCH" \
              --title "Release ${TAG}" \
              --generate-notes
          fi
