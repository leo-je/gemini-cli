name: 'Build and Release Binaries'

# 参照 test-build-binary.yml 的多平台矩阵，改动有三处：
#   1. 触发条件为 releases/* 分支推送
#   2. 去掉签名与集成测试步骤（本 fork 没有 Apple/Windows 证书，也不想在
#      发布流程里消耗 Gemini API 额度）
#   3. 增加汇总 job，把各平台产物打成 release 资产
#
# 版本号取自 package.json 的 version。同一分支重复推送会复用同一个 tag，
# 因此不会产生多个 release。
on:
  push:
    branches:
      - 'releases/*'
  workflow_dispatch:

permissions:
  contents: 'write'

defaults:
  run:
    shell: 'bash'

jobs:
  build:
    name: 'Build (${{ matrix.platform_name }})'
    runs-on: '${{ matrix.os }}'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: 'ubuntu-latest'
            platform_name: 'linux-x64'
            arch: 'x64'
          - os: 'windows-latest'
            platform_name: 'win32-x64'
            arch: 'x64'
          - os: 'macos-latest' # Apple Silicon
            platform_name: 'darwin-arm64'
            arch: 'arm64'
          - os: 'macos-latest' # Intel, running on ARM via Rosetta
            platform_name: 'darwin-x64'
            arch: 'x64'

    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8' # ratchet:actions/checkout@v5
        with:
          persist-credentials: false

      - name: 'Optimize Windows Performance'
        if: "matrix.os == 'windows-latest'"
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true
          Stop-Service -Name "wsearch" -Force -ErrorAction SilentlyContinue
          Set-Service -Name "wsearch" -StartupType Disabled
          Stop-Service -Name "SysMain" -Force -ErrorAction SilentlyContinue
          Set-Service -Name "SysMain" -StartupType Disabled
        shell: 'powershell'

      - name: 'Set up Node.js'
        uses: 'actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020' # ratchet:actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          architecture: '${{ matrix.arch }}'
          cache: 'npm'

      - name: 'Install dependencies'
        run: 'npm ci'

      - name: 'Build Binary'
        run: 'npm run build:binary'

      - name: 'Build Core Package'
        run: 'npm run build -w @google/gemini-cli-core'

      - name: 'Verify Output Exists'
        run: |
          if [ -f "dist/${{ matrix.platform_name }}/gemini" ]; then
            echo "Binary found at dist/${{ matrix.platform_name }}/gemini"
          elif [ -f "dist/${{ matrix.platform_name }}/gemini.exe" ]; then
            echo "Binary found at dist/${{ matrix.platform_name }}/gemini.exe"
          else
            echo "Error: Binary not found in dist/${{ matrix.platform_name }}/"
            ls -R dist/
            exit 1
          fi

      - name: 'Smoke Test Binary'
        run: |
          if [ -f "dist/${{ matrix.platform_name }}/gemini.exe" ]; then
            "./dist/${{ matrix.platform_name }}/gemini.exe" --version
          else
            "./dist/${{ matrix.platform_name }}/gemini" --version
          fi

      # Windows gets its own step because neither of the two tools used below
      # is dependable there: Git Bash on the windows runner has no `zip` on
      # PATH, and GNU tar reads a `-f` argument of the form `host:path` as a
      # remote-host request, so the archive path `D:\a\_temp\...` is misread
      # and it fails with "Cannot connect to D: resolve failed".
      # `Compress-Archive` ships with Windows, so it needs nothing installed.
      - name: 'Package Binary (Windows)'
        id: 'package-win'
        if: "matrix.os == 'windows-latest'"
        shell: 'pwsh'
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $platform = '${{ matrix.platform_name }}'
          $archive = "gemini-$platform-$version.zip"
          $dest = Join-Path $env:RUNNER_TEMP $archive

          # Writes to RUNNER_TEMP so the archive cannot land inside the
          # directory being packed.
          Compress-Archive -Path "dist/$platform/*" -DestinationPath $dest

          "asset=$archive" >> $env:GITHUB_OUTPUT
          Get-Item $dest | Format-List Name, Length

      - name: 'Package Binary'
        id: 'package'
        if: "matrix.os != 'windows-latest'"
        # Plain `tar` with no GNU-only flags. `--force-local` was needed when
        # Windows also used tar (its `D:\...` archive path was read as a
        # `host:path` remote request), but Windows now goes through
        # Compress-Archive above. What is left runs on Linux and macOS, and
        # macOS ships BSD tar, which rejects that flag outright with
        # "Option --force-local is not supported".
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PLATFORM="${{ matrix.platform_name }}"
          ARCHIVE="gemini-$PLATFORM-$VERSION.tar.gz"

          # Output to RUNNER_TEMP so the archive cannot land inside the
          # directory it is packing.
          tar -czf "$RUNNER_TEMP/$ARCHIVE" -C "dist/$PLATFORM" .

          echo "asset=$ARCHIVE" >> "$GITHUB_OUTPUT"
          ls -la "$RUNNER_TEMP/$ARCHIVE"

      # Only one of the two packaging steps above runs per matrix entry, so the
      # other step's outputs are empty. The `||` picks whichever was set.
      - name: 'Upload Artifact'
        uses: 'actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02' # ratchet:actions/upload-artifact@v4
        with:
          name: 'gemini-${{ steps.package-win.outputs.asset || steps.package.outputs.asset }}'
          path: '${{ runner.temp }}/${{ steps.package-win.outputs.asset || steps.package.outputs.asset }}'
          retention-days: 7
          if-no-files-found: 'error'

  bundle:
    name: 'Build JS Bundle'
    # The bundle is JavaScript, so one linux build serves every platform — it
    # needs a Node runtime rather than a self-contained binary. Built once and
    # shipped alongside the per-platform binaries, which is what the upstream
    # release does. Packaged from the single-file build (npm run bundle:single).
    runs-on: 'ubuntu-latest'

    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8' # ratchet:actions/checkout@v5
        with:
          persist-credentials: false

      - name: 'Set up Node.js'
        uses: 'actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020' # ratchet:actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: 'Install dependencies'
        run: 'npm ci'

      - name: 'Build Bundle'
        run: 'npm run bundle:single'

      - name: 'Package Bundle'
        id: 'package'
        # zip is available on the ubuntu runner (it is not on windows-latest —
        # see the binary job). Named without a platform suffix so it is
        # recognisable as the cross-platform asset.
        run: |
          set -euo pipefail

          # yoga-layout is the one dependency the single-file build leaves
          # external: its entry point uses top-level await, which esbuild cannot
          # inline once code splitting is off. Ship it inside the archive so the
          # bundle still starts outside an npm install. The native dependencies
          # (node-pty, keytar) stay lazily required and are only needed for a
          # PTY or the keychain.
          STAGE="$RUNNER_TEMP/gemini-cli-bundle"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/node_modules"
          cp -R bundle-single/. "$STAGE/"
          cp -R node_modules/yoga-layout "$STAGE/node_modules/"

          chmod +x "$STAGE/gemini.mjs"
          (cd "$STAGE" && zip -r "$RUNNER_TEMP/gemini-cli-bundle.zip" .)

          # Prove the archive is self-contained before publishing it. Extract
          # outside the repo on purpose: inside it, Node would resolve
          # node_modules from the workspace and hide a missing dependency.
          rm -rf "$RUNNER_TEMP/test-bundle"
          mkdir -p "$RUNNER_TEMP/test-bundle"
          unzip -q "$RUNNER_TEMP/gemini-cli-bundle.zip" -d "$RUNNER_TEMP/test-bundle"
          VERSION_OUT=$(node "$RUNNER_TEMP/test-bundle/gemini.mjs" --version)
          echo "Bundle reports version: ${VERSION_OUT}"
          rm -rf "$RUNNER_TEMP/test-bundle"

          echo "asset=gemini-cli-bundle.zip" >> "$GITHUB_OUTPUT"
          ls -la "$RUNNER_TEMP/gemini-cli-bundle.zip"

      - name: 'Upload Artifact'
        uses: 'actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02' # ratchet:actions/upload-artifact@v4
        with:
          name: 'gemini-${{ steps.package.outputs.asset }}'
          path: '${{ runner.temp }}/${{ steps.package.outputs.asset }}'
          retention-days: 7
          if-no-files-found: 'error'

  bundle-windows:
    name: 'Verify JS Bundle on Windows'
    # The bundle job builds once on linux and publishes the result for every
    # platform. Nothing in that path proves the artifact is platform-neutral
    # (the windows jobs elsewhere in this repo build on Windows before running,
    # which is a different question), so run the release artifact itself here.
    # Treated as a release gate: the release job waits for it.
    needs: ['bundle']
    runs-on: 'windows-latest'

    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8' # ratchet:actions/checkout@v5
        with:
          persist-credentials: false

      - name: 'Set up Node.js'
        uses: 'actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020' # ratchet:actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: 'Download JS bundle'
        uses: 'actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0' # ratchet:actions/download-artifact@v5
        with:
          name: 'gemini-gemini-cli-bundle.zip'
          path: '${{ runner.temp }}/artifact'

      - name: 'Smoke Test Bundle'
        shell: 'pwsh'
        # Extracted outside the repository on purpose: inside it, Node would
        # resolve node_modules from the workspace and hide a missing dependency.
        run: |
          $ErrorActionPreference = 'Stop'

          $artifact = Join-Path (Join-Path $env:RUNNER_TEMP 'artifact') 'gemini-cli-bundle.zip'
          $root = Join-Path $env:RUNNER_TEMP 'test-bundle'
          Remove-Item -Recurse -Force $root -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $root | Out-Null

          Expand-Archive -Path $artifact -DestinationPath $root

          $version = & node (Join-Path $root 'gemini.mjs') --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "Bundle reports version: $version"

  release:
    name: 'Publish Release'
    needs: ['build', 'bundle', 'bundle-windows']
    runs-on: 'ubuntu-latest'

    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8' # ratchet:actions/checkout@v5
        with:
          persist-credentials: false

      - name: 'Download all binaries'
        uses: 'actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0' # ratchet:actions/download-artifact@v5
        with:
          path: 'downloads'
          merge-multiple: true
          pattern: 'gemini-*'

      - name: 'Create Release'
        env:
          GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
        run: |
          set -euo pipefail

          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          BRANCH="${GITHUB_REF#refs/heads/}"

          echo "Releasing ${TAG} from ${BRANCH}"
          ls -la downloads/

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; replacing its assets."
            gh release upload "$TAG" downloads/* --clobber
          else
            gh release create "$TAG" downloads/* \
              --target "$BRANCH" \
              --title "Release ${TAG}" \
              --generate-notes
          fi
