name: 'Links'

# 仅在 package 分支推送时触发。
# 定时器（schedule）已移除：上游的 cron 会自行触发，与分支无关，
# 正是本 fork 要避免的 Actions 额度消耗。
on:
  push:
    branches:
      - 'package'

jobs:
  linkChecker:
    if: |-
      ${{ github.repository == 'google-gemini/gemini-cli' }}
    runs-on: 'ubuntu-latest'
    steps:
      - uses: 'actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8' # ratchet:actions/checkout@v5
        with:
          persist-credentials: false

      - name: 'Link Checker'
        id: 'lychee'
        uses: 'lycheeverse/lychee-action@885c65f3dc543b57c898c8099f4e08c8afd178a2' # ratchet: lycheeverse/lychee-action@v2.6.1
        with:
          args: '--verbose --no-progress --accept 200,503 ./**/*.md'
