name: 'On Merge Smoke Test'

# 仅在 package 分支推送时触发。
# 定时器（schedule）已移除：上游的 cron 会自行触发，与分支无关，
# 正是本 fork 要避免的 Actions 额度消耗。
on:
  push:
    branches:
      - 'package'

jobs:
  smoke-test:
    if: "github.repository == 'google-gemini/gemini-cli'"
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'write'
      packages: 'write'
      issues: 'write'
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8'
        with:
          ref: '${{ github.event.inputs.ref || github.sha }}'
          fetch-depth: 0
          persist-credentials: false
      - name: 'Install Dependencies'
        run: 'npm ci'
      - name: 'Build bundle'
        run: 'npm run bundle'
      - name: 'Smoke test bundle'
        run: 'node ./bundle/gemini.js --version'
      - name: 'Create Issue on Failure'
        if: '${{ failure() && github.event.inputs.dry-run == false }}'
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          DETAILS_URL: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          REF: '${{ github.event.inputs.ref }}'
        run: |
          gh issue create \
            --title 'Smoke test failed on ${REF} @ $(date +'%Y-%m-%d')' \
            --body 'Smoke test build failed. See the full run for details: ${DETAILS_URL}' \
            --label 'priority/p0'
